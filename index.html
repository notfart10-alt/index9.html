<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flygradar Sweden</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .nav-btn { transition: all 0.2s; }
        iframe { border-radius: 12px; border: 1px solid #27272a; min-height: 520px; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100" data-theme="emerald">

    <!-- Inloggning -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center">
        <div class="bg-zinc-900 p-10 rounded-3xl shadow-2xl w-full max-w-md border border-zinc-700">
            <div class="text-center mb-8">
                <h1 class="text-4xl font-bold text-emerald-400">Flygradar Sweden</h1>
                <p class="text-zinc-400 mt-2">Modern flygövervakning</p>
            </div>

            <div class="flex gap-3 mb-8">
                <button onclick="showLogin()" id="btnLogin" class="flex-1 py-4 rounded-2xl font-medium bg-emerald-500 text-black">Logga in</button>
                <button onclick="showRegister()" id="btnRegister" class="flex-1 py-4 rounded-2xl font-medium border border-zinc-700">Skapa konto</button>
            </div>

            <div id="loginForm">
                <input type="text" id="loginUser" placeholder="Användarnamn" class="w-full p-4 bg-zinc-800 rounded-2xl mb-3">
                <input type="password" id="loginPass" placeholder="Lösenord" class="w-full p-4 bg-zinc-800 rounded-2xl mb-6">
                <button onclick="login()" class="w-full bg-emerald-500 hover:bg-emerald-600 py-4 rounded-2xl font-semibold">Logga in</button>
            </div>

            <div id="registerForm" class="hidden">
                <input type="email" id="regEmail" placeholder="Emailadress" class="w-full p-4 bg-zinc-800 rounded-2xl mb-3">
                <input type="text" id="regUser" placeholder="Användarnamn" class="w-full p-4 bg-zinc-800 rounded-2xl mb-3">
                <input type="password" id="regPass" placeholder="Lösenord" class="w-full p-4 bg-zinc-800 rounded-2xl mb-6">
                <button onclick="register()" class="w-full bg-emerald-500 hover:bg-emerald-600 py-4 rounded-2xl font-semibold">Skapa konto</button>
            </div>
        </div>
    </div>

    <!-- Huvudapp -->
    <div id="mainApp" class="hidden flex flex-col h-screen">
        <header class="bg-zinc-900 border-b border-zinc-700 px-6 py-4">
            <h1 class="text-2xl font-bold text-emerald-400">Flygradar Sweden</h1>
        </header>

        <div class="flex flex-1 overflow-hidden">
            <div class="w-72 bg-zinc-900 border-r border-zinc-700 p-4 space-y-2">
                <button onclick="showPage('hem')" class="nav-btn active w-full text-left px-5 py-3 rounded-2xl hover:bg-zinc-800">Hem</button>
                <button onclick="showPage('karta')" class="nav-btn w-full text-left px-5 py-3 rounded-2xl hover:bg-zinc-800">Karta</button>
                <button onclick="showPage('arrdep')" class="nav-btn w-full text-left px-5 py-3 rounded-2xl hover:bg-zinc-800">Avgångar & Ankomster</button>
                <button onclick="showPage('atc')" class="nav-btn w-full text-left px-5 py-3 rounded-2xl hover:bg-zinc-800">ATC Radio</button>
                <button onclick="showPage('installningar')" class="nav-btn w-full text-left px-5 py-3 rounded-2xl hover:bg-zinc-800">Inställningar</button>
                <button onclick="logout()" class="nav-btn w-full text-left px-5 py-3 rounded-2xl hover:bg-red-950 text-red-400 mt-8">Logga ut</button>
            </div>

            <div class="flex-1 p-8 overflow-auto">
                <div id="hem" class="page">
                    <h2 class="text-3xl font-bold mb-4">Välkommen tillbaka</h2>
                    <p class="text-zinc-400">Din personliga svenska flygportal.</p>
                </div>

                <div id="karta" class="page hidden">
                    <h2 class="text-3xl font-bold mb-4">Live Karta</h2>
                    <iframe id="mapFrame" src="https://globe.adsbexchange.com/" class="w-full h-[85vh]"></iframe>
                </div>

                <!-- Avgångar & Ankomster med Iframes + Sök -->
                <div id="arrdep" class="page hidden">
                    <h2 class="text-3xl font-bold mb-4">Avgångar & Ankomster</h2>
                    
                    <input type="text" id="airportSearch" 
                           onkeyup="filterAirports()" 
                           placeholder="Sök flygplats (Arlanda, ESSA, Örebro...)" 
                           class="w-full p-4 bg-zinc-800 rounded-2xl mb-6 focus:outline-none focus:ring-2 focus:ring-emerald-500">

                    <div id="airportList" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <!-- Fylls med JavaScript -->
                    </div>
                </div>

                <div id="atc" class="page hidden">
                    <h2 class="text-3xl font-bold mb-4">ATC Radio - ESOE Örebro</h2>
                    <div class="bg-zinc-900 p-6 rounded-3xl max-w-lg">
                        <p class="mb-4"><strong>120.275 MHz</strong> — Tower / Approach</p>
                        <audio controls class="w-full">
                            <source src="https://livestream.liveatc.net/ESOE" type="audio/mpeg">
                        </audio>
                    </div>
                </div>

                <div id="installningar" class="page hidden">
                    <h2 class="text-3xl font-bold mb-6">Inställningar</h2>
                    <div class="max-w-xl space-y-8">
                        <div class="bg-zinc-900 p-6 rounded-3xl">
                            <h3 class="text-xl mb-3">Kartkälla</h3>
                            <select id="mapSelect" onchange="changeMap()" class="w-full p-4 bg-zinc-800 rounded-2xl">
                                <option value="https://globe.adsbexchange.com/">ADS-B Exchange</option>
                                <option value="https://www.adsb.fi/">ADS-B.fi</option>
                                <option value="https://live.skyvector.com/">SkyVector</option>
                            </select>
                        </div>

                        <div class="bg-zinc-900 p-6 rounded-3xl">
                            <h3 class="text-xl mb-3">Tema</h3>
                            <select id="themeSelect" onchange="changeTheme()" class="w-full p-4 bg-zinc-800 rounded-2xl">
                                <option value="emerald">Emerald (Standard)</option>
                                <option value="blue">Blå</option>
                                <option value="slate">Mörk Grå</option>
                            </select>
                        </div>

                        <div class="bg-zinc-900 p-6 rounded-3xl">
                            <h3 class="text-xl mb-3">Notifikationer</h3>
                            <button onclick="requestNotifications()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-5 rounded-2xl font-medium">
                                Aktivera notiser för militärflyg & specialflyg
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
    const airports = [
        { name: "Stockholm Arlanda", code: "ESSA", url: "https://www.flightaware.com/live/airport/ESSA" },
        { name: "Göteborg Landvetter", code: "ESGG", url: "https://www.flightaware.com/live/airport/ESGG" },
        { name: "Malmö Sturup", code: "ESMS", url: "https://www.flightaware.com/live/airport/ESMS" },
        { name: "Örebro", code: "ESOE", url: "https://www.flightaware.com/live/airport/ESOE" },
        { name: "Stockholm Skavsta", code: "ESKN", url: "https://www.flightaware.com/live/airport/ESKN" },
        { name: "Stockholm Bromma", code: "ESSB", url: "https://www.flightaware.com/live/airport/ESSB" },
        { name: "Umeå", code: "ESNU", url: "https://www.flightaware.com/live/airport/ESNU" },
        { name: "Luleå", code: "ESPA", url: "https://www.flightaware.com/live/airport/ESPA" }
    ];

    function renderAirports(filtered) {
        const container = document.getElementById('airportList');
        container.innerHTML = '';

        filtered.forEach(ap => {
            const card = document.createElement('div');
            card.className = "bg-zinc-900 p-6 rounded-3xl";
            card.innerHTML = `
                <h3 class="text-xl font-semibold mb-4">${ap.name} (${ap.code})</h3>
                <iframe src="${ap.url}" class="w-full"></iframe>
            `;
            container.appendChild(card);
        });
    }

    function filterAirports() {
        const term = document.getElementById('airportSearch').value.toLowerCase();
        const filtered = airports.filter(a => 
            a.name.toLowerCase().includes(term) || a.code.toLowerCase().includes(term)
        );
        renderAirports(filtered);
    }

    // Övriga funktioner
    function showLogin() { document.getElementById('loginForm').classList.remove('hidden'); document.getElementById('registerForm').classList.add('hidden'); }
    function showRegister() { document.getElementById('loginForm').classList.add('hidden'); document.getElementById('registerForm').classList.remove('hidden'); }

    function register() {
        const user = document.getElementById('regUser').value.trim();
        const pass = document.getElementById('regPass').value.trim();
        if (!user || !pass) return alert("Användarnamn och lösenord krävs");
        localStorage.setItem('fr_user', user);
        localStorage.setItem('fr_pass', pass);
        alert("Konto skapat!");
        showLogin();
    }

    function login() {
        const user = document.getElementById('loginUser').value.trim();
        const pass = document.getElementById('loginPass').value.trim();
        if (user === localStorage.getItem('fr_user') && pass === localStorage.getItem('fr_pass')) {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            showPage('hem');
        } else {
            alert("Fel användarnamn eller lösenord");
        }
    }

    function logout() {
        document.getElementById('mainApp').classList.add('hidden');
        document.getElementById('loginScreen').classList.remove('hidden');
    }

    function showPage(page) {
        document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
        document.getElementById(page).classList.remove('hidden');
        if (page === 'arrdep') filterAirports();
    }

    function changeMap() {
        document.getElementById('mapFrame').src = document.getElementById('mapSelect').value;
    }

    function changeTheme() {
        const theme = document.getElementById('themeSelect').value;
        document.documentElement.setAttribute('data-theme', theme);
    }

    function requestNotifications() {
        if (!("Notification" in window)) return alert("Din webbläsare stödjer inte notiser.");
        Notification.requestPermission().then(perm => {
            if (perm === "granted") alert("✅ Notiser aktiverade!");
        });
    }

    // Start
    showLogin();
    window.onload = () => renderAirports(airports);
</script>

</body>
</html>
